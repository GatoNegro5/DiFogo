name: Build and Release CI

on:
  push:
    tags:
      - 'v*' # El pipeline solo se disparará cuando envíes un tag (ej. v1.0.0)

jobs:
  # Red anti-regresión: si alguna prueba falla, no se compila ni se publica.
  test:
    name: Tests (flutter test + cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: "difogo-rust-test"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.4'

      - name: Install Dependencies
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Rust tests
        working-directory: rust
        run: cargo test

  build:
    name: Build Artifacts
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
            build_cmd: flutter build apk --release
            asset_name: app-release.apk
            rust_targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            asset_name: DiFogo-Installer.exe
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            asset_name: DiFogo-MacOS.zip
            rust_targets: x86_64-apple-darwin, aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 🛠️ INYECCIÓN 1: Instalar Rust y los Targets Nativos por OS
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust_targets }}
          # 3.2.13: flutter_rust_bridge_codegen formatea con rustfmt.
          components: rustfmt

      # 🛠️ INYECCIÓN 1.5: Caché Global de Rust (Evita recompilar crates nativos en cada push)
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: "difogo-rust-${{ matrix.os }}"

      # 🛠️ INYECCIÓN 2: Descarga Binaria Precompilada (0 minutos de delay)
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Flutter Rust Bridge Codegen Fast
        run: cargo binstall flutter_rust_bridge_codegen@2.12.0 cargo-expand --no-confirm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.4'

      - name: Install Dependencies
        run: flutter pub get

      # 🛠️ INYECCIÓN 3: Generar Memoria FFI (Evita el Linker Error en iOS/Mac/Android)
      - name: Generate FFI Bindings
        run: flutter_rust_bridge_codegen generate

      # 🛠️ INYECCIÓN 4: Purgar y enlazar CocoaPods en MacOS antes de compilar
      - name: Clean & Setup CocoaPods (MacOS Only)
        if: matrix.target == 'macos'
        run: |
          cd macos
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Setup Android NDK
        if: matrix.target == 'apk'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # Versión de producción más estable para Flutter/Rust
          add-to-path: false

      # Llave fija de Android: el APK siempre lleva la misma firma y el
      # celular actualiza encima sin desinstalar.
      - name: Prepare Android signing key
        if: matrix.target == 'apk'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 3.1.35: sin llave el APK no se publica (antes salia firmado en debug).
          if [ -z "$KS_B64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64: el APK no se firma en debug."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/difogo-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/difogo-release.jks" >> "$GITHUB_ENV"

      - name: Build Platform
        if: matrix.target != 'windows'
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ "${{ matrix.target }}" = "apk" ]; then
            # 3.1.35: versionCode = build de pubspec.yaml (M*10000+m*100+p).
            flutter build apk --release --build-name="${GITHUB_REF_NAME#v}"
          else
            ${{ matrix.build_cmd }} --build-name="${GITHUB_REF_NAME#v}"
          fi

      # 3.2.14: entorno MSVC (cl.exe, INCLUDE/LIB y ninja de VS en PATH)
      # para que el CMake de whisper-rs-sys pueda usar el generador Ninja.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target == 'windows'
        with:
          arch: x64

      # 3.2.13: MSBuild FileTracker (FTK1011): la ruta del .tlog del
      # TryCompile de CMake de whisper-rs-sys bajo build\windows\x64\plugins\
      # superaba MAX_PATH (266 > 260). Se compila desde la unidad corta W:
      # (subst a la misma carpeta del workspace): las rutas bajan ~15-17
      # caracteres y build\ queda en el mismo lugar para los pasos siguientes.
      - name: Build Platform (Windows, ruta corta W:)
        if: matrix.target == 'windows'
        shell: cmd
        run: |
          rem 3.2.16: compilar desde la raiz W:\ dejaba PROJECT_DIR=W:\ en
          rem generated_config.cmake; la barra final escapaba el ';' de la lista
          rem de entorno de CMake y flutter_assemble recibia 'W:;FLUTTER_TARGET=...'.
          rem Se monta la carpeta padre del workspace en W: y se entra a
          rem W:\WSN (WSN = ultimo segmento de GITHUB_WORKSPACE, sin fijar el nombre).
          for %%I in ("%GITHUB_WORKSPACE%\..") do set "WSP=%%~fI"
          for %%I in ("%GITHUB_WORKSPACE%") do set "WSN=%%~nxI"
          echo subst W: = %WSP% , carpeta %WSN%
          subst W: "%WSP%"
          if errorlevel 1 exit /b 1
          cd /d "W:\%WSN%"
          if errorlevel 1 exit /b 1
          rem 3.2.15: ort-sys 2.0.0-rc.10 (copy-dylibs) toma OUT_DIR.ancestors().nth(3)
          rem pensando en el layout viejo de cargo; con el build-dir nuevo de cargo 1.99
          rem (release\build\ort-sys\HASH\out) eso cae en release\build y luego copia
          rem las dll a release\build\examples y release\build\deps, que no existen.
          rem Se crean antes del build (target-dir de cargokit + target msvc).
          set "ORTB=W:\%WSN%\build\windows\x64\plugins\rust_lib_gatomix_player\cargokit_build\x86_64-pc-windows-msvc\release\build"
          if not exist "%ORTB%\examples" mkdir "%ORTB%\examples"
          if not exist "%ORTB%\deps" mkdir "%ORTB%\deps"
          set "V=%GITHUB_REF_NAME:~1%"
          rem 3.2.14: el crate cmake lee CMAKE_GENERATOR; whisper-rs-sys compila
          rem con Ninja (sin MSBuild ni FileTracker). Flutter pasa -G propio.
          set "CMAKE_GENERATOR=Ninja"
          where ninja || echo ninja-no-encontrado
          rem 3.2.14: -v para ver el error real de cargo en el log del CI.
          call flutter build windows --release --build-name=%V% -v
          set "RC=%ERRORLEVEL%"
          cd /d "%GITHUB_WORKSPACE%"
          subst W: /D
          exit /b %RC%

      - name: Verify Windows Executable
        if: matrix.target == 'windows'
        # 3.1.76: el binario es difogo.exe; sin el, el instalador quedaria sin exe
        run: if not exist build\windows\x64\runner\Release\difogo.exe exit /b 1
        shell: cmd

      - name: Compile Windows Installer
        if: matrix.target == 'windows'
        run: |
          set "V=${{ github.ref_name }}"
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVer=%V:~1% windows_setup.iss
        shell: cmd

      - name: Zip MacOS Build
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app DiFogo-MacOS.zip

      - name: Upload Artifacts to Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.target == 'apk' && 'build/app/outputs/flutter-apk/app-release.apk' || '' }}
            ${{ matrix.target == 'windows' && 'DiFogo-Installer.exe' || '' }}
            ${{ matrix.target == 'macos' && 'DiFogo-MacOS.zip' || '' }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: DiFogo ${{ github.ref_name }}
          files: |
            artifacts/app-release.apk
            artifacts/DiFogo-Installer.exe
            artifacts/DiFogo-MacOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # APK de Karaoke para Google TV: la app de escritorio lo baja del release
  # cuando la laptop no tiene Flutter ni la carpeta gatomix_tv.
  gatomix_tv:
    name: Build GatoMix Karaoke APK
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'

      # 3.1.35: misma llave fija que la app (actualiza encima sin desinstalar).
      - name: Prepare Android signing key (TV)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64: el APK TV no se firma en debug."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/difogo-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/difogo-release.jks" >> "$GITHUB_ENV"

      - name: Build TV APK
        working-directory: gatomix_tv
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../gatomix-tv.apk

      - name: Publish gatomix-tv.apk
        uses: softprops/action-gh-release@v2
        with:
          name: DiFogo ${{ github.ref_name }}
          files: gatomix-tv.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  djiphone:
    name: Build DjIphone IPA
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-ios

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: difogo-rust-ios-ipa

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Flutter Rust Bridge Codegen Fast
        run: cargo binstall flutter_rust_bridge_codegen@2.12.0 cargo-expand --no-confirm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate FFI Bindings
        run: flutter_rust_bridge_codegen generate

      # CocoaPods dispara el script de Cargokit (librería Rust). El proyecto
      # Swift Package Manager no lo hace. Solo en este job.
      - name: Regenerate iOS project with CocoaPods
        run: |
          cp ios/Runner/Info.plist "$RUNNER_TEMP/DjIphone-Info.plist"
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --org com.gatonegro5 .
          cp "$RUNNER_TEMP/DjIphone-Info.plist" ios/Runner/Info.plist
          perl -pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = com\.gatonegro5\.gatomixPlayer;/PRODUCT_BUNDLE_IDENTIFIER = com.gatonegro5.gatomix;/g' ios/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          cd ios
          perl -pi -e "s/^# (platform :ios, '[0-9.]+')/\$1/" Podfile
          grep -q "^platform :ios," Podfile || printf "\nplatform :ios, '15.0'\n" >> Podfile
          pod repo update
          pod install
          cd ..

      - name: Build unsigned iOS app
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flutter build ios --release --no-codesign --verbose -t lib/djiphone/main.dart

      - name: Pack DjIphone.ipa
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr DjIphone.ipa Payload
          rm -rf Payload

      - name: Publish DjIphone.ipa
        uses: softprops/action-gh-release@v2
        with:
          name: DiFogo ${{ github.ref_name }}
          files: DjIphone.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}